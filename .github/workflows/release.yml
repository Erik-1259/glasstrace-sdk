name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Release mode"
        required: true
        type: choice
        options:
          - canary
          - stable
        default: canary

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # On push to main: only create/update the Version Packages PR.
  # Never auto-publish — all publishing is manual via workflow_dispatch.
  version:
    name: Version Packages PR
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: corepack enable

      - run: npm ci

      - name: Create or update Version Packages PR
        uses: changesets/action@v2
        with:
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Manual dispatch: publish canary or stable to npm.
  publish:
    name: Publish (${{ inputs.mode }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # OIDC for npm trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          # `changeset status` compares against .changeset/config.json's
          # baseBranch. A manual canary may run from another branch, so the
          # default single-commit checkout is not enough to resolve `main`.
          fetch-depth: 0

      - name: Make Changesets base branch resolvable
        shell: bash
        run: git show-ref --verify --quiet refs/heads/main || git branch --track main refs/remotes/origin/main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm 11.5.1+ required for OIDC trusted publishing (tokenless).
      # Node 22 bundles npm 10.x which does not support it.
      # Corepack's npm support is unreliable in GitHub Actions — it
      # does not always override the bundled npm version. Use explicit
      # global install instead.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.6.1

      - run: npm ci

      # Ask Changesets itself whether the pending files produce a package
      # release. Counting Markdown files is insufficient: Changesets ignores
      # its README and agent-guide files, while empty and explicit `none`
      # changesets do not produce a new version. In those cases, snapshot
      # versioning is a no-op and publishing would re-tag the current stable
      # semver as canary (see 0.14.0 incident).
      - name: Guard — require versionable changesets for canary
        if: ${{ inputs.mode == 'canary' }}
        shell: bash
        run: |
          npx changeset status --output="$RUNNER_TEMP/changeset-status.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const status = JSON.parse(
            readFileSync(`${process.env.RUNNER_TEMP}/changeset-status.json`, "utf8"),
          );
          const versionableTypes = new Set(["patch", "minor", "major"]);
          const releases = Array.isArray(status?.releases) ? status.releases : [];
          const versionableReleases = releases.filter((release) =>
            release !== null &&
            typeof release === "object" &&
            typeof release.name === "string" &&
            release.name.trim() !== "" &&
            versionableTypes.has(release.type) &&
            typeof release.oldVersion === "string" &&
            release.oldVersion.trim() !== "" &&
            typeof release.newVersion === "string" &&
            release.newVersion.trim() !== "" &&
            release.newVersion !== release.oldVersion
          );
          if (versionableReleases.length === 0) {
            console.error("::error::Canary mode requires at least one versionable package release in .changeset/.");
            console.error("::error::Without one, snapshot versioning is a no-op and canary publication would re-tag a stable version.");
            process.exit(1);
          }
          console.log(`Found ${versionableReleases.length} versionable package release(s).`);
          NODE

      # Snapshot version FIRST in canary mode so tsup's
      # `define: { __SDK_VERSION__: pkg.version }` substitution at build
      # time bakes the canary version into the dist bundle. Running
      # snapshot AFTER build (the prior order) caused the published
      # canary to ship `dist/` built from the pre-snapshot stable, so
      # the bundled `__SDK_VERSION__` literal lied about which version
      # the artifact was tagged as on npm — directly observed in the
      # SDK-050 canary `0.0.0-canary-20260507174112` whose CLI bundles
      # contained `"1.4.0"` (DISC-1602).
      #
      # For stable, the gate `if: canary` skips this step and the
      # version that landed via the merged Version Packages PR flows
      # through the build correctly.
      - name: Snapshot version
        if: ${{ inputs.mode == 'canary' }}
        run: npx changeset version --snapshot canary

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Publish canary
        if: ${{ inputs.mode == 'canary' }}
        run: npx changeset publish --tag canary

      # Stable: publish current versions (after Version Packages PR was merged)
      # Only allowed from main branch to prevent accidental releases
      - name: Publish stable
        if: ${{ inputs.mode == 'stable' && github.ref == 'refs/heads/main' }}
        run: npx changeset publish
